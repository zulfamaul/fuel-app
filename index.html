<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Logging System - PT Bima Nusa Internasional</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Browser Image Compression -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js"></script>
    <style>
        body { background-color: #F1F5F9; font-family: sans-serif; }
        .toast-show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Toast Notification (Popup Interaktif Modern) -->
    <div id="toast" class="fixed top-5 right-5 transform -translate-y-10 opacity-0 transition-all duration-300 z-50 max-w-sm w-full bg-slate-900 text-white p-4 rounded-lg shadow-xl border-l-4 border-emerald-500 hidden">
        <div class="flex items-center justify-between">
            <span id="toastMsg" class="text-xs font-semibold"></span>
            <button onclick="hideToast()" class="text-slate-400 hover:text-white font-bold ml-2">×</button>
        </div>
    </div>

    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden border border-slate-200">
        
        <!-- Header Interaktif dengan Logo & Jam Real-time -->
        <div class="bg-slate-900 text-white p-6 border-b-4 border-red-600">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <!-- Logo Perusahaan -->
                    <img src="logo.png" alt="Logo BNI" class="h-10 w-auto object-contain bg-white/10 p-1 rounded" onerror="this.style.display='none'">
                    <div>
                        <h1 class="text-xl font-bold tracking-wide">ENTERPRISE FUEL TRACKER</h1>
                        <p class="text-xs text-slate-400">PT. Bima Nusa Internasional</p>
                    </div>
                </div>
                <!-- Live Clock Interaktif -->
                <div class="text-right">
                    <div id="liveClock" class="text-xs font-mono bg-slate-800 px-2.5 py-1 rounded border border-slate-700 text-emerald-400">00:00:00</div>
                    <div id="liveDate" class="text-[10px] text-slate-400 mt-1"></div>
                </div>
            </div>
        </div>

        <!-- Form Input -->
        <form id="fuelForm" class="p-6 space-y-4">
            
            <!-- Site / Lokasi & Shift (Disandingkan 2 Kolom) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Site / Lokasi *</label>
                    <select id="site_name" onchange="onSiteChange()" required class="w-full border border-slate-300 rounded p-2.5 text-sm focus:ring-2 focus:ring-slate-900 outline-none transition">
                        <option value="">-- Pilih Site --</option>
                        <option value="SSB">SSB</option>
                        <option value="KBB">KBB</option>
                        <option value="KDC">KDC</option>
                        <option value="IWACO">IWACO</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Shift *</label>
                    <select id="shift" required class="w-full border border-slate-300 rounded p-2.5 text-sm focus:ring-2 focus:ring-slate-900 outline-none transition">
                        <option value="Day">Day</option>
                        <option value="Night">Night</option>
                    </select>
                </div>
            </div>

            <!-- Fuel Storage -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Fuel Storage *</label>
                <select id="fuel_storage" required class="w-full border border-slate-300 rounded p-2.5 text-sm focus:ring-2 focus:ring-slate-900 outline-none transition">
                    <option value="">-- Pilih Site Terlebih Dahulu --</option>
                </select>
            </div>

            <!-- Pelaksana (PIC) -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Pelaksana (PIC) *</label>
                <select id="pic_name" required class="w-full border border-slate-300 rounded p-2.5 text-sm focus:ring-2 focus:ring-slate-900 outline-none transition">
                    <option value="">-- Pilih Site Terlebih Dahulu --</option>
                </select>
            </div>

            <!-- Transaksi & No Voucher -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Transaksi *</label>
                    <select id="receipt_issued" required class="w-full border border-slate-300 rounded p-2.5 text-sm focus:ring-2 focus:ring-slate-900 outline-none transition">
                        <option value="RECEIPT">RECEIPT</option>
                        <option value="ISSUED">ISSUED</option>
                        <option value="TRANSFER">TRANSFER</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">No Voucher</label>
                    <input type="text" id="no_voucher" placeholder="Contoh: 12345" class="w-full border border-slate-300 rounded p-2.5 text-sm focus:ring-2 focus:ring-slate-900 outline-none transition">
                </div>
            </div>

            <!-- No Unit & Jenis Material -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">No Unit *</label>
                    <input type="text" id="no_unit" list="unitOptions" placeholder="Ketik No Unit..." required class="w-full border border-slate-300 rounded p-2.5 text-sm focus:ring-2 focus:ring-slate-900 outline-none transition" autocomplete="off">
                    <datalist id="unitOptions"></datalist>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Jenis Material *</label>
                    <select id="material_type" required class="w-full border border-slate-300 rounded p-2.5 text-sm focus:ring-2 focus:ring-slate-900 outline-none transition">
                        <option value="OB">OB</option>
                        <option value="COAL">COAL</option>
                        <option value="TOP SOIL">TOP SOIL</option>
                        <option value="MUD">MUD</option>
                        <option value="GENERAL">GENERAL</option>
                    </select>
                </div>
            </div>

            <!-- HM & Jumlah Liter -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">HM Fuel Truck *</label>
                    <input type="text" id="hm_fuel_truck" placeholder="Contoh: 20000" required class="w-full border border-slate-300 rounded p-2.5 text-sm focus:ring-2 focus:ring-slate-900 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Jumlah Liter *</label>
                    <input type="number" step="any" id="fuel_amount" placeholder="Contoh: 123.5" required class="w-full border border-slate-300 rounded p-2.5 text-sm focus:ring-2 focus:ring-slate-900 outline-none transition">
                </div>
            </div>

            <!-- Evidence Foto 1 + Interactive Preview -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Evidence HM Unit (Foto) *</label>
                <input type="file" id="evidence_hm" accept="image/*" required class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer">
                <img id="preview_hm" class="mt-2 h-28 w-auto rounded border border-slate-200 hidden object-cover shadow-sm" alt="Preview HM">
            </div>

            <!-- Evidence Foto 2 + Interactive Preview -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Evidence Jumlah Liter (Foto) *</label>
                <input type="file" id="evidence_liter" accept="image/*" required class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer">
                <img id="preview_liter" class="mt-2 h-28 w-auto rounded border border-slate-200 hidden object-cover shadow-sm" alt="Preview Liter">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded transition duration-200 text-sm tracking-wider uppercase mt-4 shadow-lg flex items-center justify-center space-x-2">
                <span>KIRIM DATA FUEL</span>
            </button>

        </form>
    </div>

    <!-- Menghubungkan File Master Data External -->
    <script src="./masterData.js"></script>

    <script>
        // KOORDINAT SUPABASE
        const SUPABASE_URL = "https://srygivwnsjyjmacwokix.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyeWdpdnduc2p5am1hY3dva2l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NjUyNTgsImV4cCI6MjEwNTU0MTI1OH0.GhsqIHUaww0af6P2USDyUpw2FuY_IzrihtFXGbSp2SY";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Load Initial Master Data (Auto-Complete No Unit)
        document.addEventListener("DOMContentLoaded", function() {
            initUnitDatalist();
            autoSelectShift();
        });

        // (Bonus) Otomatis memilih Day/Night berdasarkan jam komputer lokal saat ini
        function autoSelectShift() {
            const currentHour = new Date().getHours();
            const shiftSelect = document.getElementById("shift");
            if (currentHour >= 7 && currentHour < 19) {
                shiftSelect.value = "Day";
            } else {
                shiftSelect.value = "Night";
            }
        }

        function initUnitDatalist() {
            const datalist = document.getElementById("unitOptions");
            if (!datalist || typeof MASTER_DATA === 'undefined') return;
            
            datalist.innerHTML = "";
            MASTER_DATA.masterUnitGlobal.forEach(unit => {
                const option = document.createElement("option");
                option.value = unit;
                datalist.appendChild(option);
            });
        }

        // Trigger Saat Site Dipilih
        function onSiteChange() {
            const site = document.getElementById("site_name").value;
            const storageSelect = document.getElementById("fuel_storage");
            const picSelect = document.getElementById("pic_name");

            storageSelect.innerHTML = '<option value="">-- Pilih Storage --</option>';
            picSelect.innerHTML = '<option value="">-- Pilih PIC --</option>';

            if (site && typeof MASTER_DATA !== 'undefined') {
                if (MASTER_DATA.storagePerSite[site]) {
                    MASTER_DATA.storagePerSite[site].forEach(storage => {
                        const opt = document.createElement("option");
                        opt.value = storage;
                        opt.textContent = storage;
                        storageSelect.appendChild(opt);
                    });
                }

                if (MASTER_DATA.picPerSite[site]) {
                    MASTER_DATA.picPerSite[site].forEach(pic => {
                        const opt = document.createElement("option");
                        opt.value = pic;
                        opt.textContent = pic;
                        picSelect.appendChild(opt);
                    });
                }
            }
        }

        // Jam & Tanggal Real-time Interaktif
        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString('id-ID');
            document.getElementById('liveDate').innerText = now.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Preview Foto Interaktif
        function setupPreview(inputId, previewId) {
            document.getElementById(inputId).addEventListener('change', function(e) {
                const file = e.target.files[0];
                const preview = document.getElementById(previewId);
                if (file) {
                    preview.src = URL.createObjectURL(file);
                    preview.classList.remove('hidden');
                } else {
                    preview.classList.add('hidden');
                }
            });
        }
        setupPreview('evidence_hm', 'preview_hm');
        setupPreview('evidence_liter', 'preview_liter');

        // Toast Notification Interaktif
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;
            
            toast.className = `fixed top-5 right-5 transform transition-all duration-300 z-50 max-w-sm w-full text-white p-4 rounded-lg shadow-xl border-l-4 ${isError ? 'bg-red-900 border-red-500' : 'bg-slate-900 border-emerald-500'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('toast-show'), 10);

            setTimeout(hideToast, 5000);
        }

        function hideToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('toast-show');
            setTimeout(() => toast.classList.add('hidden'), 300);
        }

        // Kompresi Foto
        async function compressImage(file) {
            const options = { maxSizeMB: 0.2, maxWidthOrHeight: 1024, useWebWorker: true };
            try { return await imageCompression(file, options); } 
            catch (e) { return file; }
        }

        // Upload ke Supabase Storage
        async function uploadPhoto(file) {
            const compressed = await compressImage(file);
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.jpg`;
            
            const { data, error } = await supabaseClient.storage
                .from('fuel-photos')
                .upload(fileName, compressed, { contentType: 'image/jpeg' });

            if (error) throw error;

            const { data: publicUrlData } = supabaseClient.storage
                .from('fuel-photos')
                .getPublicUrl(fileName);

            return publicUrlData.publicUrl;
        }

        // Form Submit
        document.getElementById('fuelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-pulse">MENGOMPRES & MENGIRIM DATA...</span>`;

            try {
                const fileHM = document.getElementById('evidence_hm').files[0];
                const fileLiter = document.getElementById('evidence_liter').files[0];

                const urlHM = await uploadPhoto(fileHM);
                const urlLiter = await uploadPhoto(fileLiter);

                const payload = {
                    site_name: document.getElementById('site_name').value,
                    shift: document.getElementById('shift').value,
                    fuel_storage: document.getElementById('fuel_storage').value,
                    pic_name: document.getElementById('pic_name').value,
                    receipt_issued: document.getElementById('receipt_issued').value,
                    no_voucher: document.getElementById('no_voucher').value || null,
                    no_unit: document.getElementById('no_unit').value,
                    material_type: document.getElementById('material_type').value,
                    hm_fuel_truck: document.getElementById('hm_fuel_truck').value,
                    fuel_amount: parseFloat(document.getElementById('fuel_amount').value),
                    evidence_hm_url: urlHM,
                    evidence_liter_url: urlLiter
                };

                const { error } = await supabaseClient.from('fuel_logs').insert([payload]);
                if (error) throw error;

                showToast("SUKSES: Data Fuel berhasil disimpan!");
                document.getElementById('fuelForm').reset();
                autoSelectShift(); // Reset shift otomatis sesuai jam saat ini
                document.getElementById('preview_hm').classList.add('hidden');
                document.getElementById('preview_liter').classList.add('hidden');

            } catch (err) {
                showToast("GAGAL: " + (err.message || err), true);
            } finally {
                btn.disabled = false;
                btn.innerText = "KIRIM DATA FUEL";
            }
        });
    </script>
</body>
</html>
